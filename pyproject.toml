[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Permissioned Tool-Using Agent Sandbox"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "langgraph>=1.2,<2",
    "groq>=0.11,<1",
    "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]