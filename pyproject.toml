[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Permissioned Tool-Using Agent Sandbox"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "langgraph>=1.2,<2",
    "groq>=0.11,<1",
    "python-dotenv>=1.0,<2",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "httpx2>=0.1,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]